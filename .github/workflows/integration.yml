name: CI - Integration

on:
  push:
    branches:
      - main

jobs:
  integration:
    name: Integration & Trigger Deployment
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🧪 Run tests (if available)
        run: yarn test || echo "⚠️ No tests found or tests failed (ignored for now)"

      - name: 🚀 Trigger Deployment Workflow via GitHub API
        env:
          GH_PAT: ${{ secrets.GH_PAT }} # Personal Access Token stored in GitHub Secrets
        run: |
          echo "📤 Triggering deploy.yml workflow on main branch..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
